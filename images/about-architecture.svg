<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%" fill="none" role="img" aria-label="Avenrix Healthcare Solutions Architectural and Engineering Infrastructure Cutaway">
  <defs>
    <!-- Architectural Micro Grid -->
    <pattern id="aboutGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#012C4E" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>

    <!-- Structural Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#012C4E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#012C4E" stop-opacity="0.02" />
    </linearGradient>

    <!-- Pipeline Accent Gradients -->
    <linearGradient id="o2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F16419" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F16419" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="560" fill="#FFFFFF" />
  <rect width="800" height="560" fill="url(#aboutGrid)" />

  <!-- Outer Architectural Framing Border -->
  <rect x="30" y="30" width="740" height="500" stroke="#012C4E" stroke-opacity="0.16" stroke-width="1" />
  <rect x="36" y="36" width="728" height="488" stroke="#012C4E" stroke-opacity="0.08" stroke-width="0.5" stroke-dasharray="3 3" />

  <!-- Header Datum Line -->
  <line x1="30" y1="75" x2="770" y2="75" stroke="#012C4E" stroke-opacity="0.12" stroke-width="1" />
  <text x="50" y="60" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#012C4E">AVENRIX INFRASTRUCTURE // AXONOMETRIC SYSTEM LAYOUT</text>
  <text x="750" y="60" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" letter-spacing="1" fill="#64748B" text-anchor="end">ISO 14644-1 / HTM 02-01 SPEC</text>

  <!-- Axonometric Surgical & Cleanroom Spatial Cutaway -->
  <g transform="translate(100, 80)">
    <!-- Isometric Grid Floor Plane -->
    <path d="M 300 130 L 580 270 L 300 410 L 20 270 Z" fill="#F8FAFC" stroke="#012C4E" stroke-width="1.2" stroke-opacity="0.25" />
    
    <!-- Floor Grid Tile Subdivisions -->
    <path d="M 230 165 L 510 305 M 160 200 L 440 340 M 90 235 L 370 375" stroke="#012C4E" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="2 2" />
    <path d="M 370 165 L 90 305 M 440 200 L 160 340 M 510 235 L 230 375" stroke="#012C4E" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="2 2" />

    <!-- Left Rear Modular Wall System -->
    <path d="M 20 270 L 20 110 L 300 -30 L 300 130 Z" fill="url(#wallGrad)" stroke="#012C4E" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Wall Vertical Joint Splines -->
    <line x1="90" y1="75" x2="90" y2="235" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="160" y1="40" x2="160" y2="200" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="230" y1="5" x2="230" y2="165" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Right Rear Modular Wall System -->
    <path d="M 300 130 L 300 -30 L 580 110 L 580 270 Z" fill="#F1F5F9" stroke="#012C4E" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Wall Joint Splines -->
    <line x1="370" y1="5" x2="370" y2="165" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="440" y1="40" x2="440" y2="200" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="510" y1="75" x2="510" y2="235" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Flush Double Glazed Vision Panel (Window) in Left Wall -->
    <polygon points="105,82 145,62 145,152 105,172" fill="#FFFFFF" stroke="#012C4E" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="108,86 142,67 142,148 108,168" fill="#012C4E" fill-opacity="0.05" stroke="#F16419" stroke-width="0.75" stroke-opacity="0.8" />
    <text x="125" y="122" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#012C4E" text-anchor="middle" transform="rotate(-26 125 122)">VISION PANEL</text>

    <!-- Medical Gas Pipeline Distribution (Overhead High-Level Trunking) -->
    <g stroke="url(#o2Grad)" stroke-width="2.5" stroke-linecap="round">
      <path d="M 40 85 L 280 -35 L 560 105" />
      <path d="M 40 95 L 280 -25 L 560 115" stroke="#012C4E" stroke-width="1.8" stroke-opacity="0.5" />
    </g>
    <!-- Gas Pipeline Drop Points -->
    <line x1="460" y1="65" x2="460" y2="140" stroke="#F16419" stroke-width="1.8" />
    <circle cx="460" cy="142" r="3.5" fill="#F16419" />
    <text x="470" y="145" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#F16419">MGPS TERMINAL</text>

    <!-- Overhead Laminar Air Flow Plenum Canopy -->
    <path d="M 300 40 L 460 120 L 300 200 L 140 120 Z" fill="url(#canopyGrad)" stroke="#012C4E" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 300 40 L 300 200 M 140 120 L 460 120" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 3" />

    <!-- Laminar Downflow Streamlines -->
    <g stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 3">
      <line x1="220" y1="160" x2="220" y2="280" />
      <line x1="260" y1="180" x2="260" y2="300" />
      <line x1="300" y1="200" x2="300" y2="320" />
      <line x1="340" y1="180" x2="340" y2="300" />
      <line x1="380" y1="160" x2="380" y2="280" />
    </g>

    <!-- Downward Air Velocity Indicator Cone -->
    <g fill="#F16419" opacity="0.85">
      <polygon points="300,290 297,282 303,282" />
      <polygon points="260,270 257,262 263,262" />
      <polygon points="340,270 337,262 343,262" />
    </g>

    <!-- Central Modular Theatre / Cleanroom Plinth Block -->
    <g transform="translate(230, 220)">
      <!-- Top Surface -->
      <path d="M 70 20 L 140 55 L 70 90 L 0 55 Z" fill="#FFFFFF" stroke="#012C4E" stroke-width="1.2" />
      <!-- Left Side -->
      <path d="M 0 55 L 70 90 L 70 125 L 0 90 Z" fill="#F1F5F9" stroke="#012C4E" stroke-width="1.2" />
      <!-- Right Side -->
      <path d="M 70 90 L 140 55 L 140 90 L 70 125 Z" fill="#E2E8F0" stroke="#012C4E" stroke-width="1.2" />
      <!-- Top Indicator Line -->
      <line x1="70" y1="35" x2="70" y2="75" stroke="#F16419" stroke-width="1.5" />
      <circle cx="70" cy="55" r="3" fill="#F16419" />
    </g>

    <!-- Technical Specification Tag Flag -->
    <g transform="translate(370, 260)">
      <line x1="0" y1="0" x2="45" y2="-25" stroke="#F16419" stroke-width="1" />
      <circle cx="0" cy="0" r="2.5" fill="#F16419" />
      <rect x="45" y="-45" width="150" height="38" rx="2" fill="#FFFFFF" stroke="#012C4E" stroke-width="0.8" stroke-opacity="0.3" filter="drop-shadow(0 2px 6px rgba(1,44,78,0.08))" />
      <rect x="45" y="-45" width="3" height="38" fill="#F16419" />
      <text x="54" y="-32" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.5" fill="#012C4E">ULTRA-CLEAN ZONE</text>
      <text x="54" y="-20" font-family="'Inter', sans-serif" font-size="7" fill="#64748B">AIR VELOCITY: 0.38 m/s</text>
      <text x="54" y="-10" font-family="'Inter', sans-serif" font-size="7" fill="#64748B">PRESSURE: POSITIVE CASSETTE</text>
    </g>

    <!-- Return Air Grille Callout -->
    <g transform="translate(60, 240)">
      <line x1="0" y1="0" x2="-30" y2="-20" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="2" fill="#64748B" />
      <text x="-35" y="-23" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="end">LOW LEVEL AIR RETURN</text>
    </g>
  </g>

  <!-- Bottom Architectural Metadata Block -->
  <line x1="30" y1="495" x2="770" y2="495" stroke="#012C4E" stroke-opacity="0.12" stroke-width="1" />
  <text x="50" y="515" font-family="'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#012C4E">INTEGRATED ENGINEERING: HVAC • MODULAR OT • CLEANROOM • MGPS</text>
  <text x="750" y="515" font-family="'Inter', sans-serif" font-size="8" font-weight="500" letter-spacing="1" fill="#64748B" text-anchor="end">AVENRIX HEALTHCARE SOLUTIONS</text>
</svg>
